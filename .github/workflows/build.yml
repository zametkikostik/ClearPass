name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bootstrap Gradle Wrapper
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -s gradlew ] || [ "$(wc -c < gradlew)" -lt 100 ]; then
            curl -fsSL -o gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew"
          fi
          chmod +x gradlew
          ls -lh gradlew gradle/wrapper/

      - name: Prepare jniLibs + assets
        env:
          SINGBOX_URL: ${{ vars.SINGBOX_URL }}
          HEV_JNI_URL: ${{ vars.HEV_JNI_URL }}
        run: |
          set -euo pipefail
          JNI=app/src/main/jniLibs/arm64-v8a
          ASSETS=app/src/main/assets
          mkdir -p "$JNI" "$ASSETS"

          if [ -f "$JNI/libsingbox.so" ]; then
            echo "libsingbox.so present"
          elif [ -n "${SINGBOX_URL:-}" ]; then
            curl -fL --retry 3 -o "$JNI/libsingbox.so" "$SINGBOX_URL"
          else
            echo "::warning::No libsingbox.so — SAFE MODE APK"
          fi

          if [ -f "$JNI/libhev-jni.so" ]; then
            echo "libhev-jni.so present"
          elif [ -n "${HEV_JNI_URL:-}" ]; then
            curl -fL --retry 3 -o "$JNI/libhev-jni.so" "$HEV_JNI_URL"
          else
            curl -fL --retry 3 -o "$JNI/libhev-socks5-tunnel.so" \
              "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.0/hev-socks5-tunnel-android-arm64-v8a" \
              || echo "WARN: hev download failed"
          fi

          if [ ! -f "$ASSETS/geoip.db" ]; then
            curl -fL --retry 3 -o "$ASSETS/geoip.db" \
              "https://github.com/SagerNet/sing-geoip/releases/latest/download/geoip.db" || true
          fi
          if [ ! -f "$ASSETS/geosite.db" ]; then
            curl -fL --retry 3 -o "$ASSETS/geosite.db" \
              "https://github.com/SagerNet/sing-geosite/releases/latest/download/geosite.db" || true
          fi
          touch "$ASSETS/.gitkeep"
          ls -lh "$JNI" "$ASSETS" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" dist/ClearPass-debug.apk
          sha256sum dist/ClearPass-debug.apk | tee dist/ClearPass-debug.apk.sha256
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPass-debug
          path: |
            dist/ClearPass-debug.apk
            dist/ClearPass-debug.apk.sha256
          if-no-files-found: error

      # Attach APK to existing / new GitHub Release (tag v* or release event)
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClearPass-debug.apk
            dist/ClearPass-debug.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
